<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ settings.APP_NAME }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />

    <!-- Prevent Flash of Unstyled Theme: DEFAULT TO LIGHT MODE unless explicitly saved as dark -->
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('app_theme');
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (_) {}
        })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS with Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/app.css" />

    {% block head %}{% endblock %}
</head>
<body class="h-full bg-[#f8fafc] dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 font-sans antialiased flex selection:bg-indigo-500 selection:text-white transition-colors duration-200">

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm hidden lg:hidden transition-opacity"></div>

    <!-- ===== Sidebar ===== -->
    {% include "_sidebar.html" %}

    <!-- ===== Main Layout (Full Width) ===== -->
    <div class="flex-1 flex flex-col min-h-screen min-w-0 overflow-hidden w-full">
        <!-- Top bar (Full Width) -->
        <header class="h-16 bg-white/90 dark:bg-[#0d1322]/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 sticky top-0 z-30 flex items-center justify-between px-4 sm:px-6 lg:px-8 xl:px-10 gap-4 shrink-0 transition-colors w-full">
            
            <!-- Left: Mobile menu button & Search Bar -->
            <div class="flex items-center gap-3 flex-1 max-w-xl xl:max-w-2xl">
                <!-- Hamburger Button for Mobile -->
                <button type="button" id="mobile-menu-open-btn" class="lg:hidden p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>

                <!-- Search Input with Ctrl+K -->
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </div>
                    <input type="text"
                           id="tool-search-input"
                           placeholder="Tìm kiếm công cụ, ví dụ: pdf, srt, hash..."
                           class="w-full pl-10 pr-16 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/70 text-xs sm:text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 dark:focus:border-indigo-400 transition" />
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <span class="text-[10px] font-medium font-mono text-slate-400 dark:text-slate-500 bg-white dark:bg-slate-800 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-700 shadow-2xs">Ctrl K</span>
                    </div>
                </div>
            </div>

            <!-- Right: Status Badge & Quick Controls -->
            <div class="flex items-center gap-2.5 sm:gap-3 shrink-0">
                <!-- Local Workspace Badge -->
                <div class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-800/40 text-emerald-700 dark:text-emerald-400 shadow-2xs">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-subtle-pulse"></span>
                    <span>Local Workspace</span>
                </div>

                <!-- Theme Toggle Button in Topbar -->
                <button type="button" id="topbar-theme-toggle" title="Chuyển chế độ Sáng / Tối"
                        class="p-2 sm:p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:border-indigo-300 dark:hover:border-slate-700 transition shadow-2xs flex items-center justify-center cursor-pointer">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-slate-600"></i>
                </button>

                <!-- Settings Button -->
                <a href="/settings" title="Cài đặt hệ thống"
                   class="p-2 sm:p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:border-indigo-300 transition shadow-2xs">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </a>
            </div>
        </header>

        <!-- Page content (Full Width) -->
        <main class="flex-1 px-4 sm:px-6 lg:px-8 xl:px-10 py-6 sm:py-8 w-full overflow-y-auto">
            <div class="w-full">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Inline Unified Theme Switcher (Guaranteed Zero Cache Issues) -->
    <script>
        (function() {
            function updateThemeUI(theme) {
                const thumb = document.getElementById("theme-thumb");
                const isDark = (theme === "dark");
                if (isDark) {
                    document.documentElement.classList.add("dark");
                    if (thumb) thumb.style.transform = "translateX(24px)";
                } else {
                    document.documentElement.classList.remove("dark");
                    if (thumb) thumb.style.transform = "translateX(0px)";
                }
                try { localStorage.setItem("app_theme", theme); } catch (_) {}
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }

            function toggleAppTheme() {
                const isDarkNow = document.documentElement.classList.contains("dark");
                updateThemeUI(isDarkNow ? "light" : "dark");
            }

            document.addEventListener("DOMContentLoaded", function() {
                // Default is LIGHT mode unless user saved 'dark'
                const savedTheme = localStorage.getItem("app_theme") || "light";
                updateThemeUI(savedTheme);

                const sidebarBtn = document.getElementById("theme-toggle-btn");
                const topbarBtn = document.getElementById("topbar-theme-toggle");

                if (sidebarBtn) {
                    sidebarBtn.onclick = function(e) {
                        e.preventDefault();
                        toggleAppTheme();
                    };
                }
                if (topbarBtn) {
                    topbarBtn.onclick = function(e) {
                        e.preventDefault();
                        toggleAppTheme();
                    };
                }
            });
        })();
    </script>

    <!-- Additional scripts -->
    <script src="/static/js/app.js?v=0.1.2"></script>
    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
