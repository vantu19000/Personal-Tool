<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ settings.APP_NAME }}{% endblock %}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom assets -->
    <link rel="stylesheet" href="/static/css/app.css" />

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 font-sans antialiased flex">

    <!-- ===== Sidebar ===== -->
    {% include "_sidebar.html" %}

    <!-- ===== Main content ===== -->
    <div class="flex-1 flex flex-col min-h-screen">
        <!-- Top bar -->
        <header class="h-14 bg-white border-b border-slate-200 flex items-center px-6 shrink-0">
            <h2 class="text-sm font-semibold text-slate-700 truncate">
                {% block page_title %}Dashboard{% endblock %}
            </h2>
        </header>

        <!-- Page content -->
        <main class="flex-1 p-8 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
